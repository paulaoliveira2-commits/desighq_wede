<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h1h1, initial-scale=1.0">
    <title>Aula 09: Agnetes de Contato</title>
</head>
<body>
 <h1>Meus Amigos</h1>
 <hr/>
 <form action="#" id="cadastro" method="post">
    <table>
        <tr>
            <td>Nome</td>
            <td>
                <input type="text" required name="nome" minlength="3">
            </td>
        </tr>
        <tr>
            <td>Data de Nascimento</td>
            <td>
                <input type="date" name="nasc"/>
            </td>
        </tr>
        <tr>
            <td>WhatsApp</td>
            <td>
                <input type="tel" name="WhatsApp">
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <input type="submit" value="Adicionar">
                <input type="reset">
            </td>
        </tr>
    </table>
 </form>
 <ul id="lista">
    <li>Lista Vazia</li>
 </ul>

    <script src="./js/app1.js" desfer></script>
</body>
</html>
